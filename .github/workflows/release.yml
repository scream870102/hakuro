name: Release

# Pushing a version tag is the whole trigger: it builds the NSIS installer and
# publishes it as a downloadable GitHub release.
on:
  push:
    tags:
      - "v*"

# tauri-action creates the release and uploads the installer to it.
permissions:
  contents: write

jobs:
  release:
    # Windows only, and not by preference: the bundle target is NSIS, the crate
    # depends on `windows`, and the undecorated window is Win32 work.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the configured version
        shell: bash
        run: |
          configured=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$configured" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $configured."
            echo "::error::The installer is named from the configured version, so the release would carry Hakuro_${configured}_x64-setup.exe under a $GITHUB_REF_NAME tag."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Hakuro ${{ github.ref_name }}
          # Published straight away: a draft is not downloadable by anyone else.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
