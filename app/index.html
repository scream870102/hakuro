<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hakuro</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- The poster behind everything: one acid band, the song title as an outline, grain. -->
    <div class="bg" aria-hidden="true">
      <div class="bg__band"></div>
      <div class="bg__band bg__band--thin"></div>
      <div class="bg__word" id="bg-word"></div>
      <svg class="bg__shards" viewBox="0 0 940 760" preserveAspectRatio="xMidYMid slice">
        <g fill="#000"><path d="M80 120l26 8-20 18z"/><path d="M300 90l14 22-24 2z"/><path d="M40 420l30-6-10 26z"/><path d="M330 470l18 4-12 14z"/></g>
        <g class="bg__shards--accent"><path d="M520 70l10 16-18 0z"/><path d="M880 210l14 10-16 6z"/><path d="M610 690l20-4-6 16z"/><path d="M890 600l-12 14-6-16z"/></g>
        <g fill="#3a3a3a"><path d="M700 130l18 6-12 12z"/><path d="M760 520l16-10 2 18z"/></g>
      </svg>
      <div class="bg__grain"></div>
    </div>

    <header class="chrome" data-tauri-drag-region="deep">
      <!-- Native chrome is off, so the window's own controls live here. Buttons
           block dragging by themselves, which is why the whole bar can be
           "deep": the brand and the status drag the window, these do not. -->
      <div class="brand"><span class="brand__mark" aria-hidden="true"></span><span class="brand__name">HAKURO</span></div>
      <span class="status" id="status-text">Connecting…</span>
      <button class="cmdk" id="cmdk-open" type="button" title="Command palette (Ctrl+K)"
              aria-label="Command palette" aria-haspopup="dialog">
        <b>›_</b><span>COMMANDS</span><kbd>Ctrl+K</kbd>
      </button>
      <div class="chrome__spacer"></div>
      <div class="window-controls">
        <button class="window-button" id="lyrics-search-open" type="button" disabled
                title="Find lyrics" aria-label="Find lyrics" aria-haspopup="dialog">
          <svg data-icon="findLyrics" aria-hidden="true"></svg>
        </button>
        <button class="window-button" id="settings-open" type="button" title="Settings" aria-label="Settings">
          <svg data-icon="settings" aria-hidden="true"></svg>
        </button>
        <button class="window-button" id="refresh-playback" type="button"
                title="Refresh playback" aria-label="Refresh playback">
          <svg data-icon="refresh" aria-hidden="true"></svg>
        </button>
        <button class="window-button" id="mode-toggle" type="button"
                title="Compact mode" aria-label="Compact mode" aria-pressed="false">
          <svg data-icon="compact" class="icon-compact" aria-hidden="true"></svg>
          <svg data-icon="expand" class="icon-expand" aria-hidden="true"></svg>
        </button>
        <button class="window-button window-button--pin" id="pin" type="button"
                title="Keep on top" aria-label="Keep window on top" aria-pressed="false">
          <svg data-icon="alwaysOnTop" aria-hidden="true"></svg>
        </button>
        <span class="window-controls__sep" aria-hidden="true"></span>
        <button class="window-button" id="win-minimize" type="button" title="Minimize" aria-label="Minimize">
          <svg data-icon="minimize" aria-hidden="true"></svg>
        </button>
        <button class="window-button" id="win-maximize" type="button" title="Maximize" aria-label="Maximize">
          <svg data-icon="maximize" class="icon-maximize" aria-hidden="true"></svg>
          <svg data-icon="restore" class="icon-restore" aria-hidden="true"></svg>
        </button>
        <button class="window-button window-button--close" id="win-close" type="button" title="Close" aria-label="Close">
          <svg data-icon="close" aria-hidden="true"></svg>
        </button>
      </div>
    </header>

    <main class="deck">
      <section class="object-zone">
        <!-- The controls live on a cube you can grab and turn: the cover on the
             front (tap it to play or pause; skip waits at its edges), volume on
             the right, the record on top with the queue at its centre, lyric and
             window tools round the back. Compact with lyrics moves the record to
             the right end, in place of the spine. -->
        <div class="scene" id="scene">
          <div class="glow" id="glow"></div>
          <div class="shadow" id="shadow"></div>
          <div class="cube" id="cube">
            <div class="core"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="face face--top" data-face="top">
              <div class="vinyl" id="vinyl" title="Spin to seek">
                <div class="disc" id="disc"><div class="disc__label"><img id="disc-art" alt="" draggable="false" /></div></div>
                <div class="vinyl__sheen"></div><div class="vinyl__pin"></div>
                <!-- The queue, at the record's centre once the pointer is over it. -->
                <button class="vinyl__queue" id="queue-open" type="button" disabled
                        title="Queue" aria-label="Show the queue" aria-haspopup="dialog">
                  <svg data-icon="queue" class="icon-line" aria-hidden="true"></svg>
                </button>
              </div>
              <!-- Compact only: the lid takes the record's place. The window's
                   switches and the queue's sit over the cover (skip and play are on
                   the cover itself); once the cube stretches, the song and how far
                   through it is sit beside them. -->
              <div class="lid">
                <div class="lid__row">
                  <button class="tool tool--icon" type="button" data-proxy="compact-lyrics"
                          title="Show lyrics" aria-label="Show lyrics" aria-pressed="false">
                    <svg data-icon="compactLyrics" aria-hidden="true"></svg>
                  </button>
                  <button class="tool tool--icon" type="button" data-proxy="pin"
                          title="Keep on top" aria-label="Keep window on top" aria-pressed="false">
                    <svg data-icon="alwaysOnTop" aria-hidden="true"></svg>
                  </button>
                  <button class="tool tool--icon tool--full" type="button" data-proxy="mode-toggle" data-plain
                          title="Full mode" aria-label="Full mode">
                    <svg data-icon="expand" aria-hidden="true"></svg>
                  </button>
                </div>
                <div class="lid__row">
                  <button class="tool tool--icon tool--mode" type="button" data-proxy="queue-open"
                          title="Queue" aria-label="Show the queue">
                    <svg data-icon="queue" class="icon-line" aria-hidden="true"></svg>
                  </button>
                  <button class="tool tool--icon tool--mode" type="button" data-proxy="shuffle" data-follow-hidden hidden
                          title="Shuffle" aria-label="Shuffle" aria-pressed="false">
                    <svg data-icon="shuffle" class="icon-line" aria-hidden="true"></svg>
                  </button>
                  <button class="tool tool--icon tool--mode" type="button" data-proxy="repeat" data-follow-hidden hidden
                          title="Repeat" aria-label="Repeat" aria-pressed="false">
                    <svg data-icon="repeat" class="icon-line" aria-hidden="true"></svg>
                  </button>
                </div>
              </div>
              <div class="lid__meta">
                <b class="lid__title" id="lid-title"></b>
                <span class="lid__artist" id="lid-artist"></span>
                <div class="lid__progress">
                  <span id="lid-time">00:00</span>
                  <i class="lid__track"><i class="lid__fill" id="lid-fill"></i></i>
                  <span id="lid-total">00:00</span>
                </div>
              </div>
              <!-- The tool is drawn; this checkbox is the real control, for main.ts. -->
              <input id="compact-lyrics" type="checkbox" hidden aria-label="Show lyrics in compact mode" />
            </div>
            <div class="face face--front" data-face="front" id="cover-face">
              <div class="cover-box" id="cover-box">
                <img class="cover cover--base" id="album-art" alt="" draggable="false" />
                <img class="cover cover--peek" id="cover-peek" alt="" draggable="false" />
                <div class="cover-empty"><span>H</span><small>NO COVER</small></div>
                <div class="cover-shade"></div>
                <!-- The lens under the pointer shows what a tap does: play while paused, pause while playing. -->
                <i class="lens">
                  <svg data-icon="play" class="lens__play" aria-hidden="true"></svg>
                  <svg data-icon="pause" class="lens__pause" aria-hidden="true"></svg>
                </i>
                <!-- The cover takes the pointer (a tap toggles, a drag turns the cube);
                     this button is the same control for the keyboard. -->
                <button class="cover-hit" id="play-pause" type="button" disabled
                        title="Play or pause" aria-label="Play or pause"></button>
                <!-- Skip waits at the cover's edges, shown while the pointer is over it. -->
                <button class="cover-skip cover-skip--previous glow-btn" id="previous" type="button" disabled
                        title="Previous track" aria-label="Previous track">
                  <svg data-icon="previous" aria-hidden="true"></svg>
                </button>
                <button class="cover-skip cover-skip--next glow-btn" id="next" type="button" disabled
                        title="Next track" aria-label="Next track">
                  <svg data-icon="next" aria-hidden="true"></svg>
                </button>
              </div>
              <div class="spill"></div>
              <!-- Compact only: the cube stretches sideways and the lyrics move in here. -->
              <div class="face__lyrics" id="cube-lyrics"></div>
            </div>
            <div class="face face--right" data-face="right">
              <span class="face__label">02 VOLUME</span>
              <div class="spill"></div>
              <div class="dial" id="volume-control" title="Volume control is unavailable for this player or device">
                <div class="dial__ticks"></div><div class="dial__ring"></div><div class="dial__cap"></div>
                <button class="dial__read dial__mute" id="volume-mute" type="button" disabled
                        title="Mute" aria-label="Mute" aria-pressed="false" data-muted="false">
                  <output id="volume-value" for="volume">—</output><small>VOL</small>
                  <svg data-icon="mute" class="dial__action dial__action--mute" aria-hidden="true"></svg>
                  <svg data-icon="unmute" class="dial__action dial__action--unmute" aria-hidden="true"></svg>
                </button>
                <!-- The dial is drawn; this range is the real control, for the keyboard and for main.ts. -->
                <input class="dial__input" id="volume" type="range" min="0" max="100" step="1" value="0" disabled
                       aria-label="Volume" aria-describedby="volume-value" />
              </div>
              <!-- Compact only: the song set down the side like a case's spine. The
                   dial moves round to the left face there. -->
              <div class="spine">
                <b class="spine__title" id="spine-title"></b>
                <span class="spine__artist" id="spine-artist"></span>
              </div>
            </div>
            <div class="face face--back" data-face="back">
              <span class="face__label">03 LYRICS</span>
              <div class="tools">
                <button class="tool" type="button" data-proxy="source-badge">SOURCE
                  <svg data-icon="lyricsSource" class="tool__glyph" aria-hidden="true"></svg>
                </button>
                <button class="tool" type="button" data-proxy="lyrics-search-open">FIND
                  <svg data-icon="findLyrics" class="tool__glyph" aria-hidden="true"></svg>
                </button>
                <button class="tool" type="button" data-proxy="reload">RELOAD
                  <svg data-icon="refresh" class="tool__glyph" aria-hidden="true"></svg>
                </button>
                <!-- Compact has no header, so its settings button lives here. -->
                <button class="tool tool--compact" type="button" data-proxy="settings-open">SETTINGS
                  <svg data-icon="settings" class="tool__glyph" aria-hidden="true"></svg>
                </button>
              </div>
              <!-- The tool is drawn; this button is the real control, for main.ts. -->
              <button id="reload" type="button" disabled hidden>Reload lyrics</button>
            </div>
            <div class="face face--left" data-face="left">
              <span class="face__label">04 WINDOW</span>
              <div class="tools">
                <button class="tool" type="button" data-proxy="follow" aria-pressed="true">FOLLOW
                  <svg data-icon="followLyrics" class="tool__glyph" aria-hidden="true"></svg>
                </button>
                <button class="tool" type="button" data-proxy="pin" aria-pressed="false">PIN
                  <svg data-icon="alwaysOnTop" class="tool__glyph" aria-hidden="true"></svg>
                </button>
                <button class="tool" type="button" data-proxy="mode-toggle" aria-pressed="false">MINI
                  <svg data-icon="compact" class="tool__glyph icon-compact" aria-hidden="true"></svg><svg data-icon="expand" class="tool__glyph icon-expand" aria-hidden="true"></svg>
                </button>
              </div>
              <!-- The tool is drawn; this checkbox is the real control, for main.ts. -->
              <input id="follow" type="checkbox" checked hidden aria-label="Follow lyrics" />
            </div>
            <div class="face face--bottom" data-face="bottom"><span class="logo">H</span></div>
          </div>
          <div class="hint" id="cube-hint">DRAG THE CUBE TO TURN IT ↻</div>
        </div>
        <div class="meta">
          <div class="meta__eyebrow">NOW PLAYING</div>
          <h1 class="meta__title" id="track-name">No track playing</h1>
          <p class="meta__artist" id="track-artist"></p>
        </div>
      </section>

      <section class="lyrics-zone">
        <div class="lyrics-head">
          <button class="badge" id="source-badge" type="button" disabled aria-haspopup="dialog"><span id="source-label">Lyrics source</span><svg data-icon="lyricsSource" aria-hidden="true"></svg></button>
          <span class="counter"><b id="line-now">--</b> / <span id="line-total">--</span></span>
        </div>
        <div class="lyrics" id="lyrics" tabindex="0">
          <div class="lyrics__empty" id="lyrics-empty">Waiting for playback…</div>
          <ol class="lyrics__list" id="lyrics-list"></ol>
        </div>
        <div class="shards" id="shards" aria-hidden="true"></div>
        <button class="notice" id="notice" type="button" hidden aria-live="polite"></button>
      </section>
    </main>

    <footer class="bar">
      <span class="time" id="time-current">00:00</span>
      <div class="scrubber" id="scrubber" role="slider" aria-label="Seek"
           aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0">
        <div class="scrubber__track"><div class="scrubber__fill" id="scrubber-fill"></div></div>
        <div class="scrubber__knob" id="scrubber-knob"></div>
      </div>
      <span class="time" id="time-total">00:00</span>
      <!-- Hidden for a player that cannot report them (ytmdesktop2). -->
      <button class="bar__mode" id="shuffle" type="button" hidden disabled
              title="Shuffle" aria-label="Shuffle" aria-pressed="false">
        <svg data-icon="shuffle" class="icon-line" aria-hidden="true"></svg>
      </button>
      <button class="bar__mode" id="repeat" type="button" hidden disabled data-mode="off"
              title="Repeat: off" aria-label="Repeat: off" aria-pressed="false">
        <svg data-icon="repeat" class="icon-line" aria-hidden="true"></svg>
      </button>
      <button class="bar__play" id="bar-play" type="button" disabled title="Play" aria-label="Play">
        <svg data-icon="play" class="icon-play" aria-hidden="true"></svg>
        <svg data-icon="pause" class="icon-pause" aria-hidden="true"></svg>
      </button>
      <button class="bar__btn bar__btn--alert" id="reconnect" type="button" hidden>RETRY CONNECTION</button>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
