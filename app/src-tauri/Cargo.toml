[package]
name = "hakuro"
version = "1.0.0"
description = "Original-language lyrics for whatever Spotify is playing."
authors = ["Eccentric Studio"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hakuro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "default-tls", "query", "form"] }
tokio = { version = "1.53.1", features = ["time", "sync", "rt", "macros"] }
regex = "1.13.1"
unicode-normalization = "0.1.25"
caseless = "0.2.2"
html-escape = "0.2.15"
base64 = "0.23.1"
thiserror = "2.0.20"
sha2 = "0.11.0"
rand = "0.10.3"
roxmltree = "0.21.1"
urlencoding = "2.1.3"
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
ferrous-opencc = { version = "0.4.0", default-features = false, features = ["t2s-conversion"] }
# `bundled` compiles SQLite from source, so the release needs no DLL beside the executable.
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-global-shortcut = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
