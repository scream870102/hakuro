<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hakuro Update</title>
    <link rel="stylesheet" href="/src/panel.css" />
  </head>
  <body class="sheet">
    <header class="win-head" data-tauri-drag-region="deep">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="win-head__title">HAKURO / UPDATE</span>
      <button class="window-button window-button--close" id="panel-close" type="button" title="Close" aria-label="Close">
        <svg data-icon="close" aria-hidden="true"></svg>
      </button>
    </header>
    <div class="panel" role="dialog" aria-labelledby="update-title">
      <div class="panel__body">
        <h2 id="update-title">New version available</h2>
        <p id="update-version"></p>
        <p>有新版本可用，前往 GitHub 查看更新內容並下載。</p>
        <p>You can turn off startup checks in Settings → Updates.</p>
      </div>
      <div class="panel__foot">
        <p id="update-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button class="ghost-button" id="update-dismiss" type="button">Later / 稍後</button>
          <a class="ghost-button ghost-button--go" id="update-release" href="https://github.com/scream870102/hakuro/releases/latest">GitHub Release ↗</a>
        </div>
      </div>
    </div>
    <script type="module" src="/src/update.ts"></script>
  </body>
</html>
